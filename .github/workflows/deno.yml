name: Deno Workspace build latest

on:
  workflow_dispatch:

jobs:
  DENO:
    runs-on: ubuntu-latest
    name: Run build

    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@feature/intermediate-deno-rust-ca-devtest
        with:
          api_url: "https://app.stage.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY }}
          pse_image_tag: "dev-test"
          debug: true
      # ============= InvisiRisk Setup End =============
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install
      # ============= InvisiRisk Cleanup =============
      - name: Cleanup PSE
        if: always()
        uses: invisirisk/pse-action@feature/intermediate-deno-rust-ca-devtest
        with:
          api_url: "https://app.stage.invisirisk.com"
          cleanup: "true"
      # ============= InvisiRisk Cleanup End =============
